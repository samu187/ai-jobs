[project]
name = "ai-jobs"
version = "0.1.0"
description = "Local job journal with agent-assisted Reed searches"
readme = "README.md"
authors = [
    { name = "samu187", email = "samuel-alciati@live.it" }
]
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "platformdirs>=4,<5"]

[project.scripts]
ai-jobs = "jobs.web:main"

[tool.uv.build-backend]
module-name = "jobs"

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"
